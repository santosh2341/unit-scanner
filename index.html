<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unit Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>Unit Scanner</h1>

  <!-- HOME -->
  <div id="home">
    <button class="big-btn" onclick="selectType('HWS')">HWS</button>
    <button class="big-btn" onclick="selectType('AC')">AC</button>
  </div>

  <!-- SCANNER -->
  <div id="scanner" style="display:none;">
    <h3 id="scanTitle"></h3>

    <video id="video" autoplay></video>

    <button class="action-btn" onclick="capture()">Scan Sticker</button>

    <canvas id="canvas" style="display:none;"></canvas>

    <textarea id="output" placeholder="Scanned text will appear here"></textarea>

    <div class="row">
      <button onclick="shareText()">Share</button>
      <button onclick="goHome()">Back</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>

</body>
</html>
